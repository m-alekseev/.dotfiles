onboarding = false

[theme]
name = "terminal"

auto_switch = false
[keys]
prefix = "ctrl+a"
detach = "prefix+d"
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
rename_tab = "prefix+,"
close_tab = "prefix+&"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
last_pane = "prefix+;"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[ui]
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true
pane_scrollbars = false
status_indicators = "symbols"
tab_bar_position = "bottom"
accent = "yellow"

[ui.sidebar.agents]
rows = [["state_icon", "state_text", "machine", "workspace", "tab"], ["agent"]]

[[ui.tab_bar_right]]
type = "datetime"
format = "%A %d %b %H:%M"

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui.toast.herdr]
position = "top-right"
